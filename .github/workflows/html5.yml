# Psych Engine 0.7.1h のフォーク内の .github/workflows/html5.yml に置く。
# Actions タブから「Run workflow」で実行。失敗したら、実行結果ページ下部の Summary にログ末尾が出る。
name: Build HTML5
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Install and build
        run: |
          set -o pipefail
          {
            haxe --version
            haxelib setup ~/haxelib
            # hmm.json は全ライブラリが最新版指定なので使わず、当時のバージョンを固定する
            # （HTML5 では Lua / HScript / 動画 / mod が無効なので SScript・hxCodec・linc_luajit は不要）
            haxelib install lime 8.0.1
            haxelib install openfl 9.2.1
            haxelib install flixel 5.2.2
            haxelib install flixel-addons 3.0.2
            haxelib install flixel-ui 2.5.0
            haxelib install hxcpp 4.3.2
            haxelib install tjson 1.4.0
            haxelib install hxjsonast 1.1.0
            haxelib list
            haxelib run lime build html5 -final
          } 2>&1 | tee build.log
      - name: Show log tail
        if: failure()
        run: |
          { echo '```'; tail -n 60 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: psych-html5
          path: export/release/html5/bin
